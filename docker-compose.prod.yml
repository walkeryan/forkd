version: '3.8'
services:
  forkd:
    image: ghcr.io/walkeryan/forkd:latest
    container_name: forkd
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      # Must be a hostname Google accepts as an OAuth redirect target — raw
      # private IPs are rejected, so the LAN deploy uses nip.io wildcard DNS.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://192.168.1.101.nip.io:3333}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-forkd}
      - POSTGRES_DB=${POSTGRES_DB:-forkd}
      # Comma-separated emails allowed to view /admin
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Web push (VAPID) + scheduled notification auth + app timezone
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - APP_TZ=${APP_TZ:-America/New_York}
      # DATABASE_URL is constructed in docker-entrypoint.sh with encodeURIComponent
      # so that base64 passwords containing '/' or '+' are handled correctly.
      # Set POSTGRES_USER/POSTGRES_DB in the stack .env to target a database
      # volume initialized under a different name (e.g. legacy "tastelog").
    depends_on:
      forkd-db:
        condition: service_healthy
    volumes:
      - forkd-uploads:/app/uploads

  forkd-db:
    image: postgres:15-alpine
    container_name: forkd-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-forkd}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-forkd}
    volumes:
      - forkd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forkd}"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: containrrr/watchtower
    container_name: forkd-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: forkd --interval 300 --cleanup

  # Cloudflare Tunnel connector — publishes the app at the public domain via
  # an outbound-only connection (no port forwarding, home IP stays hidden).
  # Requires TUNNEL_TOKEN in the stack .env; omit it and this service just
  # restarts harmlessly without affecting the app.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: forkd-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - forkd

volumes:
  forkd-uploads:
  forkd-db-data:
