version: '3.8'
services:
  forkd:
    image: ghcr.io/walkeryan/forkd:latest
    container_name: forkd
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - NEXTAUTH_URL=http://192.168.1.101:3333
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - DATABASE_URL=postgresql://tastelog:${POSTGRES_PASSWORD}@forkd-db:5432/tastelog
    depends_on:
      forkd-db:
        condition: service_healthy
    volumes:
      - forkd-uploads:/app/uploads

  forkd-db:
    image: postgres:15-alpine
    container_name: forkd-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tastelog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tastelog
    volumes:
      - forkd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastelog"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: containrrr/watchtower
    container_name: forkd-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: forkd --interval 300 --cleanup

volumes:
  forkd-uploads:
  forkd-db-data:
